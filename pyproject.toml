[project]
name = "ranking-there"
version = "0.1.0"
description = "ranking models"
authors = [
    {name = "DaryaYu",email = "33330219+DaryaYu@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy (>=2.5.4,<3.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "kaggle (>=2.2.5,<3.0.0)",
    "pyarrow (>=26.0.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "notebook (>=7.6.3,<8.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]
